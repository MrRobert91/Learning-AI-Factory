name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Audit production dependencies
        run: |
          uv export --quiet --frozen --no-dev --no-hashes --no-emit-workspace --output-file "$RUNNER_TEMP/requirements-audit.txt"
          uvx --from pip-audit==2.10.1 pip-audit --requirement "$RUNNER_TEMP/requirements-audit.txt"
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest apps/api/tests packages/factory_agents/tests -q
      - name: Build and verify backend sandbox container
        run: |
          docker build --file apps/api/Dockerfile --tag learning-ai-factory-backend:test .
          uid="$(docker run --rm learning-ai-factory-backend:test id -u)"
          test "$uid" -ne 0
          volume="backend-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker volume rm --force "$volume"' EXIT
          docker volume create "$volume"
          docker run --rm \
            --user root \
            --entrypoint python \
            --volume "$volume:/data" \
            learning-ai-factory-backend:test \
            -c 'from pathlib import Path; import sqlite3; Path("/data/db").mkdir(); sqlite3.connect("/data/db/factory.sqlite").execute("CREATE TABLE legacy (id INTEGER)").connection.commit()'
          docker run --rm \
            --volume "$volume:/data" \
            learning-ai-factory-backend:test \
            python -c 'import os, sqlite3; assert os.getuid() != 0; sqlite3.connect("/data/db/factory.sqlite").execute("ALTER TABLE legacy ADD COLUMN migrated INTEGER").connection.commit()'
          docker run --rm \
            --env PYTHON_SANDBOX_MODE=isolated \
            learning-ai-factory-backend:test \
            python scripts/verify_python_sandbox.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm run audit:prod
      - name: Audit all dependencies
        run: npm run audit:all
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Smoke test standalone proxy
        run: npm run test:proxy
      - name: Build frontend container
        working-directory: ${{ github.workspace }}
        run: docker build --file apps/web/Dockerfile apps/web
