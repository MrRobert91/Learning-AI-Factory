name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Audit production dependencies
        run: |
          uv export --quiet --frozen --no-dev --no-hashes --no-emit-workspace --output-file "$RUNNER_TEMP/requirements-audit.txt"
          uvx --from pip-audit==2.10.1 pip-audit --requirement "$RUNNER_TEMP/requirements-audit.txt"
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest apps/api/tests packages/factory_agents/tests -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm run audit:prod
      - name: Audit all dependencies
        run: npm run audit:all
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Smoke test standalone proxy
        run: npm run test:proxy
      - name: Build frontend container
        working-directory: ${{ github.workspace }}
        run: docker build --file apps/web/Dockerfile apps/web
