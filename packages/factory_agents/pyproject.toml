[project]
name = "factory-agents"
version = "0.1.0"
description = "Agents, tools, orchestration, memory and artifact contracts for AI Learning Factory"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_agents"]
