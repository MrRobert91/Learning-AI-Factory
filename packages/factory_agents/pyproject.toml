[project]
name = "factory-agents"
version = "0.1.0"
description = "Agents, tools, orchestration, memory and artifact contracts for AI Learning Factory"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "openai>=1.40",
    "ddgs>=9.0",
    "deepagents>=0.6.12",
    "langchain-openai>=1.3.5",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_agents"]
