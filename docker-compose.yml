# AI Learning Factory — local deployment: exactly two containers.
services:
  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_PASSWORD: ${APP_PASSWORD:-changeme}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      DATABASE_URL: sqlite:////data/db/factory.sqlite
      DATA_DIR: /data
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: apps/web
    ports:
      - "3000:3000"
    depends_on:
      - backend
