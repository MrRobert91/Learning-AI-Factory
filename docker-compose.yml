# AI Learning Factory — local deployment: exactly two containers.
services:
  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:3000}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      APP_PASSWORD: ${APP_PASSWORD:-changeme}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      CREDENTIAL_ENCRYPTION_KEYS: ${CREDENTIAL_ENCRYPTION_KEYS:-local:bG9jYWwtZGV2ZWxvcG1lbnQta2V5LTMyLWJ5dGVzISE=}
      DATABASE_URL: sqlite:////data/db/factory.sqlite
      DATA_DIR: /data
      PYTHON_SANDBOX_MODE: isolated
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4-flash}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TTS_VOICE: ${TTS_VOICE:-nova}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/youtube/callback}
      BUDGET_USD_PER_RUN: ${BUDGET_USD_PER_RUN:-5}
      BUDGET_PRICE_PER_MTOK_USD: ${BUDGET_PRICE_PER_MTOK_USD:-0.6}
      FFMPEG_THREADS: ${FFMPEG_THREADS:-1}
      FFMPEG_FILTER_THREADS: ${FFMPEG_FILTER_THREADS:-1}
      FFMPEG_FILTER_COMPLEX_THREADS: ${FFMPEG_FILTER_COMPLEX_THREADS:-1}
      FFMPEG_PRESET: ${FFMPEG_PRESET:-veryfast}
      FFMPEG_CRF: ${FFMPEG_CRF:-23}
      ANALYTICS_INTERVAL_DAYS: ${ANALYTICS_INTERVAL_DAYS:-0}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-ai-learning-factory}
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: apps/web
    environment:
      API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
